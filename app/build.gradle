plugins {
    id 'com.android.application'
}

android {
    namespace 'com.steelballrun.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.steelballrun.player'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        // Debug-signed on purpose: installs straight on your phone, no keystore needed.
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.media:media:1.7.0'
}
